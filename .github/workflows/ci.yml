name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wtrdrop
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wtrdrop" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://wtrdrop:ci_only_password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:i18n
      - run: pnpm typecheck
      - run: pnpm test

  admin-e2e:
    name: Admin portal browser tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wtrdrop
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wtrdrop" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The browser tests start the real API on a fresh throwaway database (apps/api e2e-server).
      TEST_DATABASE_URL: postgres://wtrdrop:ci_only_password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wtrdrop/admin exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  mobile-e2e:
    name: Mobile screens in a phone-sized browser
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wtrdrop
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wtrdrop" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The browser tests start the real API on a fresh throwaway database (apps/api e2e-server).
      TEST_DATABASE_URL: postgres://wtrdrop:ci_only_password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wtrdrop/mobile exec playwright install --with-deps chromium
      - run: pnpm test:e2e:mobile
        env: { CI: '1' }

  mobile-bundle:
    name: Mobile app bundles for Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:mobile
        env: { CI: '1' }
